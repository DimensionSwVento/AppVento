body: |
  ## Fix — feedback Sprint 3
  No deja deseleccionar áreas de hexágonos grandes, solo los pequeños.

  **Corrección:** Arreglar la deselección de hexágonos grandes.
  **Estimación:** 30-45m

  ## Criterio de aceptación
  - Un hexágono grande seleccionado se puede volver a clicar para deseleccionar.

  ## Origen
  Feedback de Sprint 3. Solo FIX (sin costo adicional). Ver `docs/feedback/sprint3-triage.md`.

