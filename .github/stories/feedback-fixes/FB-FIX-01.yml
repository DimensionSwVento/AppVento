  **Corrección:** Sincronizar el estado de selección de informativas con las capas del mapa.
  **Estimación:** 20-30m

  ## Criterio de aceptación
  - Las informativas activadas se pintan como capa en el mapa final.

  ## Origen
  Feedback de Sprint 3. Solo FIX (sin costo adicional). Ver `docs/feedback/sprint3-triage.md`.

