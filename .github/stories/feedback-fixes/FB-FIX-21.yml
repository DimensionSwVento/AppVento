body: |
  ## Fix — feedback Sprint 3
  La búsqueda por municipio a veces no delimita hexágonos o no corresponden; el modo activo no es claro.

  **Corrección:** Hacer más visible la etiqueta del modo activo ('autoselección' vs 'exploración').
  **Estimación:** 15-20m

  ## Criterio de aceptación
  - El usuario ve claramente si el modo selecciona hexágonos o solo navega.

  ## Origen
  Feedback de Sprint 3. Solo FIX (sin costo adicional). Ver `docs/feedback/sprint3-triage.md`.

