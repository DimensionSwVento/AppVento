body: |
  ## Fix — feedback Sprint 3
  No se distingue 'recurso' (viento) de 'técnica' (aerogenerador).

  **Corrección:** Si es solo etiqueta/agrupación visual, renombrar/agrupar acordemente.
  **Estimación:** 10-15m

  ## Criterio de aceptación
  - La UI distingue visualmente recurso vs técnica (si aplica sin tocar el modelo).

  ## Origen
  Feedback de Sprint 3. Solo FIX (sin costo adicional). Ver `docs/feedback/sprint3-triage.md`.

