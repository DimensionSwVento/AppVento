body: |
  ## Historia de Usuario
  Como analista, quiero ver las variables del análisis agrupadas en las 5 dimensiones con un código de color tipo heat-map GIS (empezando en morado) para identificar visualmente la categoría a la que pertenece cada variable.

  **Épica:** E4 — Configuración de Dimensiones (Variables)

  ## Criterios de Aceptación
  1. Variables agrupadas en las 5 dimensiones (técnica, ambiental, regulatoria, socioeconómica, económica)
  2. Cada dimensión tiene un color de **paleta GIS estándar empezando en morado** y bajando por la escala térmica/espectral (mismo principio que los heat-maps de generación energética)
  3. Header de cada sección muestra: nombre de dimensión + color asignado
  4. Las secciones se pueden expandir/colapsar individualmente

  ## Tareas técnicas / desarrollo
  - 📦 **BE Endpoint**: `GET /api/variables` en FastAPI que retorne `{ variables: [{ dimension, name, label, definition, type }] }` agrupadas por dimensión
  - 📦 **FE Rewrite**: añadir `/api/variables/:path*` a `next.config.ts` (mismo patrón que `/api/tiles`)
  - 📦 **FE Componente**: extender `Vento/src/app/Components/Dimensions.tsx` con secciones colapsables aplicando paleta GIS
  - 📦 **FE Constantes**: definir paleta GIS en módulo reutilizable (`Vento/src/app/Utils/gisPalette.ts`)
  - 🧪 **Tests**: backend retorna estructura esperada; frontend renderiza N grupos colapsables con sus colores

  ## Dependencias
  Ninguna externa.

  ## Estimación
  4-5h (incluye endpoint backend)
