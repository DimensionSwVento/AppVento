body: |
  ## Historia de Usuario
  Como analista, quiero ver la dimensión regulatoria (informativa) con las normas y
  etiquetas rápidas, y poder agregarla al informe, para conocer el marco normativo.

  **Épica:** E4 — Variables (dimensión regulatoria)

  ## Criterios de Aceptación
  1. La dimensión regulatoria es informativa (no puntúa) y muestra las normas con etiquetas rápidas (Aplica / Requiere trámite / Requiere verificación / No aplica) y contadores.
  2. Muestra autoridades competentes e información normativa de referencia.
  3. Opción "Agregar esta sección al informe PDF".

  ## Tareas técnicas
  - 📦 `RegulatoryPanel.tsx` (normas + etiquetas + contadores) alimentado por US08-02.
  - 🧪 Tests: etiquetas/contadores; toggle agregar al informe.

  ## Estimación
  1–1.5 días.
