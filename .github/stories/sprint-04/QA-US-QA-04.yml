body: |
  ## Historia de Usuario
  Como equipo, queremos pruebas técnicas sobre el entorno actual que cubran las
  nuevas HUs, para asegurar la calidad de la entrega.

  **Transversal — QA**

  ## Criterios de Aceptación
  1. Cobertura con Vitest + RTL de: preconfiguración del informe, admin de variables/normas/escenarios, panel económico, bugs de usuarios, variables excluyentes.
  2. Smoke E2E de "configurar informe → descargar PDF".
  3. Se ejecutan sobre el entorno actual.

  ## Tareas técnicas
  - 🧪 Tests unitarios/integración de las HUs de Ola 1/2/3.
  - 🧪 Smoke E2E del flujo de informe.

  ## Estimación
  Transversal (a lo largo del sprint).
