name: Enforce Branch Flow (develop → main)

# ═══════════════════════════════════════════════════════════
# Valida que los PRs sigan el flujo obligatorio:
#   develop → main
#
# PRs desde ramas no permitidas se marcan como fallidos.
# Las ramas deploy-test y deploy-prod son generadas por CI,
# no se permiten PRs hacia ellas.
# ═══════════════════════════════════════════════════════════

on:
  workflow_dispatch:
  pull_request:
    branches: [main, deploy-test, deploy-prod]

jobs:
  validate-branch-flow:
    name: "Validate PR Source Branch"
    runs-on: ubuntu-latest
    steps:
      - name: Verificar origen del PR
        run: |
          TARGET="${{ github.base_ref }}"
          SOURCE="${{ github.head_ref }}"

          echo "PR: $SOURCE → $TARGET"

          if [ "$TARGET" = "main" ]; then
            # Solo develop puede ir a main
            if [[ "$SOURCE" != "develop" ]]; then
              echo "::error::❌ Solo se puede hacer PR a 'main' desde 'develop'. Origen: '$SOURCE'"
              exit 1
            fi
            echo "✅ Flujo válido: develop → main"

          elif [[ "$TARGET" == deploy-* ]]; then
            # Nadie puede hacer PR a ramas de deploy — solo CI las actualiza
            echo "::error::❌ Las ramas deploy-* son generadas automáticamente por CI. No se permiten PRs."
            exit 1
          fi
