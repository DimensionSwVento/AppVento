name: CI Pipeline

# ═══════════════════════════════════════════════════════════
# Flujo:
#   develop → quality + build + security → deploy-test (staging)
#   main    → quality + build + security → deploy-prod (producción)
#
# Las ramas deploy-test y deploy-prod son permanentes y solo
# contienen Vento/ (sin docs, specs, infra). cPanel de AccuWeb
# apunta a ellas con autodeploy.
# ═══════════════════════════════════════════════════════════

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths-ignore:
      - "**.md"
      - ".github/stories/**"
      - "_bmad/**"
      - "_bmad-output/**"
      - "docs/**"
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    working-directory: Vento

jobs:
  # ─────────────────────────────────────
  # Stage 1: Calidad — lint + types + tests
  # ─────────────────────────────────────
  quality:
    name: "Lint + TypeCheck + Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Vento/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Tests unitarios
        run: npm run test:run


  # ─────────────────────────────────────
  # Stage 2: Build — compilación correcta
  # ─────────────────────────────────────
  build:
    name: "Build"
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Vento/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_KEYCLOAK_SECRET: ${{ secrets.AUTH_KEYCLOAK_SECRET }}
          AUTH_KEYCLOAK_ISSUER: ${{ secrets.AUTH_KEYCLOAK_ISSUER }}
          NEXT_PUBLIC_KEYCLOAK_URL: ${{ secrets.NEXT_PUBLIC_KEYCLOAK_URL }}
          NEXT_PUBLIC_KEYCLOAK_REALM: ${{ secrets.NEXT_PUBLIC_KEYCLOAK_REALM }}
          NEXT_PUBLIC_KEYCLOAK_ISSUER: ${{ secrets.NEXT_PUBLIC_KEYCLOAK_ISSUER }}

  # ─────────────────────────────────────
  # Stage 3: Seguridad — audit + secretos
  # ─────────────────────────────────────
  security:
    name: "Audit + Secrets Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Vento/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Audit de dependencias
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Instalar gitleaks
        run: |
          set -euo pipefail
          # URL FIJA a la versión (NO `latest/download`, que sirve los assets del
          # release más nuevo: si el latest ≠ 8.24.3 el asset no existe → descarga
          # vacía → `tar: unexpected end of file`). Se baja a archivo y se valida.
          wget -q -O gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
        working-directory: /tmp

      - name: Scan de secretos (gitleaks)
        # `--no-git`: escanea el ÁRBOL ACTUAL (no todo el historial, que multiplica
        # los ejemplos/dev por cada commit). `--config`: allowlist de rutas sin
        # secretos productivos. `--redact`: no imprime los valores en el log.
        run: gitleaks detect --no-git --redact --config "$GITHUB_WORKSPACE/.gitleaks.toml" --source . --verbose
        working-directory: ${{ github.workspace }}

  # ─────────────────────────────────────
  # Stage 4: Deploy — genera rama limpia para AccuWeb
  # ─────────────────────────────────────
  deploy:
    name: "Deploy Branch"
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determinar rama destino
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "branch=deploy-test" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "branch=deploy-prod" >> $GITHUB_OUTPUT
          fi
        working-directory: .

      - name: Generar y push rama de deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DEPLOY_BRANCH="${{ steps.target.outputs.branch }}"
          SOURCE_SHA="${{ github.sha }}"

          # crear rama orphan limpia
          git checkout --orphan "${DEPLOY_BRANCH}-tmp"
          git rm -rf .

          # traer solo Vento/ del commit original
          git checkout "${SOURCE_SHA}" -- Vento/

          # mover contenido de Vento/ a la raíz
          shopt -s dotglob
          mv Vento/* .
          rm -rf Vento

          # limpiar carpetas que no deben ir al server
          rm -rf docs _bmad _bmad-output infra node_modules .next

          # deploy-prod/-test quedan como SOLO-CONTENIDO (sin workflows): así el
          # GITHUB_TOKEN puede pushear (no puede escribir .github/workflows/). El
          # deploy SSH real lo hace el job `deploy-front` de este mismo ci.yml.
          git add -A
          git commit -m "deploy: ${DEPLOY_BRANCH} from ${SOURCE_SHA::7}"

          # force push a la rama permanente
          git push origin HEAD:refs/heads/${DEPLOY_BRANCH} --force
        working-directory: .

  # ─────────────────────────────────────
  # Stage 5: Deploy front (SSH) — SOLO producción (main).
  # Portado 1:1 de .github/deploy-prod-workflows/deploy-front.yml a un job, para
  # NO tener que escribir archivos de workflow en deploy-prod (el GITHUB_TOKEN no
  # puede). Mismo build (node 22 + secrets), mismo SSH gate→front, mismo rsync y
  # restart → comportamiento idéntico, disparado desde aquí en vez de por el push
  # a deploy-prod.
  # ─────────────────────────────────────
  deploy-front:
    name: "Deploy front (SSH)"
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_KEYCLOAK_URL: ${{ secrets.NEXT_PUBLIC_KEYCLOAK_URL }}
          NEXT_PUBLIC_KEYCLOAK_REALM: ${{ secrets.NEXT_PUBLIC_KEYCLOAK_REALM }}
          NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_KEYCLOAK_CLIENT_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_KEYCLOAK_ID: ${{ secrets.AUTH_KEYCLOAK_ID }}
          AUTH_KEYCLOAK_SECRET: ${{ secrets.AUTH_KEYCLOAK_SECRET }}
          AUTH_KEYCLOAK_ISSUER: ${{ secrets.AUTH_KEYCLOAK_ISSUER }}
          NEXT_PUBLIC_KEYCLOAK_ISSUER: ${{ secrets.NEXT_PUBLIC_KEYCLOAK_ISSUER }}
          AUTH_TRUST_HOST: ${{ secrets.AUTH_TRUST_HOST }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          NEXT_PUBLIC_USE_BACKEND: ${{ vars.NEXT_PUBLIC_USE_BACKEND }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config << EOF
          Host gate
            HostName ${{ secrets.SSH_GATE_HOST }}
            Port ${{ secrets.SSH_GATE_PORT }}
            User ${{ secrets.SSH_GATE_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
          Host front
            HostName ${{ secrets.FRONT_HOST }}
            User ${{ secrets.FRONT_USER }}
            ProxyJump gate
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
          EOF

      - name: Sincronizar artefactos
        run: |
          rsync -az --delete .next/ front:/var/www/webapp/AppVento/.next/
          rsync -az package.json package-lock.json front:/var/www/webapp/AppVento/
          rsync -az --delete public/ front:/var/www/webapp/AppVento/public/

      - name: Deps de producción y restart
        run: |
          ssh front 'cd /var/www/webapp/AppVento && npm ci --omit=dev && sudo systemctl restart nextjs && sleep 5 && curl -sI http://localhost:3000 | head -1'
