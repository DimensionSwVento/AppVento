name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths-ignore:
      - "**.md"
      - ".github/stories/**"
      - "_bmad/**"
      - "_bmad-output/**"
      - "docs/**"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: "Deploy Branch"
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') &&
      !startsWith(github.ref, 'refs/heads/deploy-')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determinar rama destino
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "branch=deploy-test" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "branch=deploy-prod" >> $GITHUB_OUTPUT
          fi

      - name: Generar y push rama de deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DEPLOY_BRANCH="${{ steps.target.outputs.branch }}"
          SOURCE_SHA="${{ github.sha }}"

          git checkout --orphan "${DEPLOY_BRANCH}-tmp"
          git rm -rf .
          git checkout "${SOURCE_SHA}" -- Vento/

          shopt -s dotglob
          mv Vento/* .
          rm -rf Vento docs _bmad _bmad-output infra node_modules .next

          git add -A
          git commit -m "deploy: ${DEPLOY_BRANCH} from ${SOURCE_SHA::7}"
          git push origin HEAD:refs/heads/${DEPLOY_BRANCH} --force
