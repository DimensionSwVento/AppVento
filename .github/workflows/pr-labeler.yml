name: PR Auto Labels

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write

jobs:
  label:
    name: "Auto Label PR"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Etiquetar PR según archivos modificados
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true

      - name: Etiquetar PR según rama destino
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET="${{ github.base_ref }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          if [ "$TARGET" = "main" ]; then
            gh pr edit "$PR_NUMBER" --add-label "env:production"
          fi
