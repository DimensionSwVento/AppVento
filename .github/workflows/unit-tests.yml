name: Unit Tests

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths-ignore:
      - "**.md"
      - ".github/stories/**"
      - "_bmad/**"
      - "_bmad-output/**"
      - "docs/**"
  pull_request:
    branches: [main]

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Vento

jobs:
  test:
    name: "Vitest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Vento/package-lock.json
      - run: npm ci
      - run: npm run test:ci
