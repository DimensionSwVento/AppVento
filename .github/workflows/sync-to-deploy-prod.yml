name: Publicar app a deploy-prod

# Publica el contenido de Vento/ (de develop) en la rama deploy-prod, aplanado
# a la raíz. Como SOLO toma Vento/, las carpetas meta del monorepo (_bmad,
# _bmad-output, .claude, docs, infra, Reportes_Entregas) nunca se copian:
# se elimina el paso manual de "limpiar y pegar" por dev.
# Conserva el .github/ de deploy-prod (workflow de deploy y demás).
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Rama/ref origen que contiene Vento/"
        default: develop
        required: true 

permissions:
  contents: write   # push a deploy-prod
  actions: write    # disparar el workflow de deploy tras el sync

concurrency:
  group: sync-deploy-prod
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy-prod
          fetch-depth: 0

      - name: Validar que la rama origen tenga Vento/
        env:
          SRC: ${{ github.event.inputs.source_ref }}
        run: |
          git fetch --no-tags origin "$SRC"
          if ! git cat-file -e "origin/${SRC}:Vento" 2>/dev/null; then
            echo "::error::La rama '${SRC}' no tiene carpeta Vento/"; exit 1
          fi

      - name: Reemplazar la app con origen/Vento (aplanado, conservando .github)
        env:
          SRC: ${{ github.event.inputs.source_ref }}
        run: |
          tmp="$(mktemp -d)"
          git archive "origin/${SRC}:Vento" | tar -x -C "$tmp"
          # Borra el contenido actual salvo .git y .github (workflows de deploy)
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          # Copia el nuevo contenido (incluye dotfiles: .env.example, .nvmrc, .gitignore)
          cp -a "$tmp"/. .
          rm -rf "$tmp"
          # Recorta lo que no pertenece a la rama de deploy (docs y unit tests).
          # <-- EDITA esta lista para conservar/excluir lo que quieras.
          for p in docs __tests__ vitest.config.ts vitest.setup.ts; do rm -rf "$p"; done

      - name: Commit, push y disparar el deploy si hay cambios
        env:
          SRC: ${{ github.event.inputs.source_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "deploy-prod ya está al día con ${SRC}/Vento — nada que publicar."
            exit 0
          fi
          git commit -m "sync(deploy-prod): app <- ${SRC}/Vento"
          git push origin HEAD:deploy-prod
          # El push hecho con GITHUB_TOKEN no dispara deploy-front por sí solo
          # (protección anti-recursión de GitHub). Lo lanzamos explícitamente:
          gh workflow run deploy-front.yml --ref deploy-prod
