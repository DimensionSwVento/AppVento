name: CI Pipeline v2

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths-ignore:
      - "**.md"
      - ".github/stories/**"
      - "_bmad/**"
      - "_bmad-output/**"
      - "docs/**"

concurrency:
  group: ci-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    working-directory: Vento

jobs:
  quality:
    name: "Quality"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Vento/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  test:
    name: "Test"
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Vento/package-lock.json
      - run: npm ci
      - run: npm run test:ci

  deploy:
    name: "Deploy Branch"
    runs-on: ubuntu-latest
    needs: test
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determinar rama destino
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "branch=deploy-test" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "branch=deploy-prod" >> $GITHUB_OUTPUT
          fi
        working-directory: .

      - name: Generar y push rama de deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DEPLOY_BRANCH="${{ steps.target.outputs.branch }}"
          SOURCE_SHA="${{ github.sha }}"

          git checkout --orphan "${DEPLOY_BRANCH}-tmp"
          git rm -rf .
          git checkout "${SOURCE_SHA}" -- Vento/

          shopt -s dotglob
          mv Vento/* .
          rm -rf Vento docs _bmad _bmad-output infra node_modules .next

          git add -A
          git commit -m "deploy: ${DEPLOY_BRANCH} from ${SOURCE_SHA::7}"
          git push origin HEAD:refs/heads/${DEPLOY_BRANCH} --force
        working-directory: .
