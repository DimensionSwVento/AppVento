name: Quality

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Vento

jobs:
  lint:
    name: "Lint + TypeCheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Vento/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
