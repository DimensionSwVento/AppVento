name: Deploy front
on:
  push:
    branches: [deploy-prod]
  workflow_dispatch:


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_KEYCLOAK_URL: ${{ secrets.NEXT_PUBLIC_KEYCLOAK_URL }}
          NEXT_PUBLIC_KEYCLOAK_REALM: ${{ secrets.NEXT_PUBLIC_KEYCLOAK_REALM }}
          NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_KEYCLOAK_CLIENT_ID }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_KEYCLOAK_ID: ${{ secrets.AUTH_KEYCLOAK_ID }}
          AUTH_KEYCLOAK_SECRET: ${{ secrets.AUTH_KEYCLOAK_SECRET }}
          AUTH_KEYCLOAK_ISSUER: ${{ secrets.AUTH_KEYCLOAK_ISSUER }}
          NEXT_PUBLIC_KEYCLOAK_ISSUER: ${{ secrets.NEXT_PUBLIC_KEYCLOAK_ISSUER }}
          AUTH_TRUST_HOST: ${{ secrets.AUTH_TRUST_HOST }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          NEXT_PUBLIC_USE_BACKEND: ${{ vars.NEXT_PUBLIC_USE_BACKEND }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config << EOF
          Host gate
            HostName ${{ secrets.SSH_GATE_HOST }}
            Port ${{ secrets.SSH_GATE_PORT }}
            User ${{ secrets.SSH_GATE_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
          Host front
            HostName ${{ secrets.FRONT_HOST }}
            User ${{ secrets.FRONT_USER }}
            ProxyJump gate
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
          EOF

      - name: Sincronizar artefactos
        run: |
          rsync -az --delete .next/ front:/var/www/webapp/AppVento/.next/
          rsync -az package.json package-lock.json front:/var/www/webapp/AppVento/
          rsync -az --delete public/ front:/var/www/webapp/AppVento/public/

      - name: Deps de producción y restart
        run: |
          ssh front 'cd /var/www/webapp/AppVento && npm ci --omit=dev && sudo systemctl restart nextjs && sleep 5 && curl -sI http://localhost:3000 | head -1'
