<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f3547"/>
      <stop offset="1" stop-color="#165170"/>
    </linearGradient>
    <style>
      .card{fill:#ffffff;stroke:#e5e7eb;stroke-width:1;rx:12;}
      .ct{fill:#165170;font-weight:700;}
      .lbl{fill:#374151;}
      .sub{fill:#6b7280;}
      .num{fill:#165170;font-weight:800;}
    </style>
  </defs>

  <rect width="1120" height="760" fill="#f7f9fb"/>

  <!-- Header -->
  <rect width="1120" height="92" fill="url(#hdr)"/>
  <text x="40" y="44" fill="#ffffff" font-size="26" font-weight="800">Vento — Sprint 4 · Resumen de cambios</text>
  <text x="40" y="72" fill="#cfe3ee" font-size="15">Preconfiguración de informe · mapa/capas · admin · rendimiento de backend · feedback del cliente (26) · manuales</text>
  <text x="1080" y="52" fill="#ffffff" font-size="13" text-anchor="end" opacity="0.85">2026-10-01</text>

  <!-- Totales -->
  <g transform="translate(40,116)">
    <rect class="card" width="330" height="88" rx="12"/>
    <text x="24" y="34" class="num" font-size="34">~40</text>
    <text x="110" y="30" class="lbl" font-size="15" font-weight="700">Frontend</text>
    <text x="110" y="50" class="sub" font-size="12">rama Sprint_4--report_preconig</text>
  </g>
  <g transform="translate(395,116)">
    <rect class="card" width="330" height="88" rx="12"/>
    <text x="24" y="34" class="num" font-size="34">~15</text>
    <text x="110" y="30" class="lbl" font-size="15" font-weight="700">Backend</text>
    <text x="110" y="50" class="sub" font-size="12">rama develop (prod = main)</text>
  </g>
  <g transform="translate(750,116)">
    <rect class="card" width="330" height="88" rx="12"/>
    <text x="24" y="34" class="num" font-size="34">~5</text>
    <text x="110" y="30" class="lbl" font-size="15" font-weight="700">Docs / arquitectura</text>
    <text x="110" y="50" class="sub" font-size="12">+ manuales técnico e instalación</text>
  </g>

  <!-- Temas -->
  <text x="40" y="238" class="ct" font-size="16">Cambios por tema</text>

  <!-- fila 1 -->
  <g transform="translate(40,252)">
    <rect class="card" width="330" height="96" rx="12"/>
    <rect width="6" height="96" fill="#165170" rx="3"/>
    <text x="22" y="30" class="lbl" font-size="15" font-weight="700">Informe / PDF</text>
    <text x="300" y="30" class="num" font-size="22" text-anchor="end">10</text>
    <text x="22" y="54" class="sub" font-size="12">Preconfig, gráficos, nitidez, tablas sin cortes (chunk),</text>
    <text x="22" y="72" class="sub" font-size="12">aviso datos-por-hex, PDF nativo.</text>
  </g>
  <g transform="translate(395,252)">
    <rect class="card" width="330" height="96" rx="12"/>
    <rect width="6" height="96" fill="#2563eb" rx="3"/>
    <text x="22" y="30" class="lbl" font-size="15" font-weight="700">Mapa / capas / heatmap</text>
    <text x="300" y="30" class="num" font-size="22" text-anchor="end">12</text>
    <text x="22" y="54" class="sub" font-size="12">Res del zoom (no se despinta), color por variable,</text>
    <text x="22" y="72" class="sub" font-size="12">excluidas, leyenda viridis, capas off, no re-pedir bulk.</text>
  </g>
  <g transform="translate(750,252)">
    <rect class="card" width="330" height="96" rx="12"/>
    <rect width="6" height="96" fill="#7c3aed" rx="3"/>
    <text x="22" y="30" class="lbl" font-size="15" font-weight="700">Admin / usuarios / soporte</text>
    <text x="300" y="30" class="num" font-size="22" text-anchor="end">8</text>
    <text x="22" y="54" class="sub" font-size="12">Modales (portal), confirmar admin, sin tildes,</text>
    <text x="22" y="72" class="sub" font-size="12">barra de carga, nav, correo de soporte en BD.</text>
  </g>

  <!-- fila 2 -->
  <g transform="translate(40,360)">
    <rect class="card" width="330" height="96" rx="12"/>
    <rect width="6" height="96" fill="#16a34a" rx="3"/>
    <text x="22" y="30" class="lbl" font-size="15" font-weight="700">Rendimiento backend</text>
    <text x="300" y="30" class="num" font-size="22" text-anchor="end">9</text>
    <text x="22" y="54" class="sub" font-size="12">Pool+threadpool, streaming anti-OOM, bulk 1 scan,</text>
    <text x="22" y="72" class="sub" font-size="12">warmup estimado, índice parcial, loadtest, /db/overview.</text>
  </g>
  <g transform="translate(395,360)">
    <rect class="card" width="330" height="96" rx="12"/>
    <rect width="6" height="96" fill="#d97706" rx="3"/>
    <text x="22" y="30" class="lbl" font-size="15" font-weight="700">Datos / catálogo / modo</text>
    <text x="300" y="30" class="num" font-size="22" text-anchor="end">6</text>
    <text x="22" y="54" class="sub" font-size="12">Catálogo desde BD, modo backend|template,</text>
    <text x="22" y="72" class="sub" font-size="12">subir master drag-and-drop, valores reales.</text>
  </g>
  <g transform="translate(750,360)">
    <rect class="card" width="330" height="96" rx="12"/>
    <rect width="6" height="96" fill="#0891b2" rx="3"/>
    <text x="22" y="30" class="lbl" font-size="15" font-weight="700">Docs / arquitectura</text>
    <text x="300" y="30" class="num" font-size="22" text-anchor="end">5</text>
    <text x="22" y="54" class="sub" font-size="12">Benchmark, arquitectura h3-pg, documento técnico,</text>
    <text x="22" y="72" class="sub" font-size="12">READMEs, manuales.</text>
  </g>

  <!-- Resultados de capacidad -->
  <g transform="translate(40,480)">
    <rect width="700" height="230" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="24" y="34" class="ct" font-size="16">Resultados de capacidad (benchmark)</text>
    <text x="24" y="66" class="lbl" font-size="13">• Techo útil ≈ <tspan font-weight="800" fill="#165170">25 usuarios concurrentes</tspan> (2 workers × 18 hilos = 36 ops BD).</text>
    <text x="24" y="92" class="lbl" font-size="13">• <tspan font-weight="700">variables-bulk</tspan> = cuello #1 (scan de bbox, ~165 MB/req).</text>
    <text x="24" y="118" class="lbl" font-size="13">• <tspan font-weight="700">warmup</tspan> → conteo estimado (reltuples); <tspan font-weight="700">excluded</tspan> → índice parcial + caché.</text>
    <text x="24" y="144" class="lbl" font-size="13">• cache-hit BD 74 % → plan <tspan font-weight="700">Fase 2 h3-pg</tspan> (PK BIGINT + MV) documentado.</text>
    <text x="24" y="178" class="sub" font-size="12">Regla: ~1 worker ≈ 18 operaciones BD concurrentes por cada ~1 GB de RAM.</text>
    <text x="24" y="202" class="sub" font-size="12">Evidencia: docs/testing/benchmark-carga-h3-2026-09-30.md</text>
  </g>

  <!-- Despliegue -->
  <g transform="translate(760,480)">
    <rect width="320" height="230" rx="12" fill="#0f3547"/>
    <text x="22" y="34" fill="#ffffff" font-size="16" font-weight="700">Despliegue</text>
    <text x="22" y="66" fill="#cfe3ee" font-size="13">1. push + merge a prod</text>
    <text x="40" y="86" fill="#9fc3d6" font-size="12">front → deploy-prod</text>
    <text x="40" y="104" fill="#9fc3d6" font-size="12">backend → main</text>
    <text x="22" y="134" fill="#cfe3ee" font-size="13">2. alembic upgrade head (0015)</text>
    <text x="22" y="156" fill="#cfe3ee" font-size="13">3. VACUUM ANALYZE hexagon</text>
    <text x="22" y="178" fill="#cfe3ee" font-size="13">4. build del front</text>
    <text x="22" y="200" fill="#cfe3ee" font-size="13">5. verificar: loadtest --db-url</text>
  </g>

  <text x="40" y="748" class="sub" font-size="11">Vento · Mavalan Software · detalle completo en docs/sprint4-resumen-commits.md</text>
</svg>
