<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f3547"/><stop offset="1" stop-color="#165170"/></linearGradient>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#165170"/></marker>
  </defs>
  <rect width="1200" height="980" fill="#f7f9fb"/>

  <!-- Header -->
  <rect width="1200" height="92" fill="url(#hdr)"/>
  <text x="40" y="42" fill="#fff" font-size="25" font-weight="800">Vento — Manual de Instalación (resumen)</text>
  <text x="40" y="70" fill="#cfe3ee" font-size="14">Orden, variables de entorno, ingesta y verificación. Detalle y .env completo en docs/manual-instalacion.md</text>
  <text x="1160" y="52" fill="#fff" font-size="13" text-anchor="end" opacity="0.85">2026-10-01</text>

  <!-- Opción rápida -->
  <g transform="translate(40,112)">
    <rect width="1120" height="44" rx="10" fill="#cce1ee"/>
    <text x="16" y="28" fill="#0f3547" font-size="13" font-weight="700">Opción rápida (dev):</text>
    <text x="168" y="28" fill="#0f3547" font-size="13">cd backend/AppVento---Backend &amp;&amp; docker compose up -d  → levanta Postgres + Keycloak + backend (:8000)</text>
  </g>

  <!-- Pasos (flujo) -->
  <text x="40" y="186" fill="#165170" font-size="16" font-weight="800">Instalación paso a paso (prod)</text>
  <g font-size="12.5">
    <rect x="40" y="198" width="255" height="96" rx="10" fill="#fff" stroke="#165170"/>
    <circle cx="66" cy="224" r="13" fill="#165170"/><text x="66" y="229" text-anchor="middle" fill="#fff" font-weight="800">1</text>
    <text x="90" y="229" fill="#0f3547" font-weight="700">PostgreSQL</text>
    <text x="56" y="256" fill="#374151" font-size="11.5">createdb · DSN postgresql+psycopg://</text>
    <text x="56" y="274" fill="#374151" font-size="11.5">max_connections ≥ (pool 20)×workers</text>

    <rect x="313" y="198" width="255" height="96" rx="10" fill="#fff" stroke="#165170"/>
    <circle cx="339" cy="224" r="13" fill="#165170"/><text x="339" y="229" text-anchor="middle" fill="#fff" font-weight="800">2</text>
    <text x="363" y="229" fill="#0f3547" font-weight="700">Keycloak</text>
    <text x="329" y="256" fill="#374151" font-size="11.5">realm + roles admin/analista</text>
    <text x="329" y="274" fill="#374151" font-size="11.5">cliente OIDC (vento-web) + secret</text>

    <rect x="586" y="198" width="255" height="96" rx="10" fill="#fff" stroke="#165170"/>
    <circle cx="612" cy="224" r="13" fill="#165170"/><text x="612" y="229" text-anchor="middle" fill="#fff" font-weight="800">3</text>
    <text x="636" y="229" fill="#0f3547" font-weight="700">Backend + ingesta</text>
    <text x="602" y="256" fill="#374151" font-size="11.5">docker build/run · alembic upgrade head</text>
    <text x="602" y="274" fill="#374151" font-size="11.5">subir máster + catálogo · VACUUM ANALYZE</text>

    <rect x="859" y="198" width="255" height="96" rx="10" fill="#fff" stroke="#165170"/>
    <circle cx="885" cy="224" r="13" fill="#165170"/><text x="885" y="229" text-anchor="middle" fill="#fff" font-weight="800">4</text>
    <text x="909" y="229" fill="#0f3547" font-weight="700">Frontend</text>
    <text x="875" y="256" fill="#374151" font-size="11.5">npm install · build · start (AccuWeb)</text>
    <text x="875" y="274" fill="#374151" font-size="11.5">NEXT_PUBLIC_USE_BACKEND=true</text>

    <line x1="295" y1="246" x2="311" y2="246" stroke="#165170" stroke-width="2" marker-end="url(#ar2)"/>
    <line x1="568" y1="246" x2="584" y2="246" stroke="#165170" stroke-width="2" marker-end="url(#ar2)"/>
    <line x1="841" y1="246" x2="857" y2="246" stroke="#165170" stroke-width="2" marker-end="url(#ar2)"/>
  </g>

  <!-- .env Frontend -->
  <g transform="translate(40,320)">
    <rect width="555" height="236" rx="12" fill="#fff" stroke="#e5e7eb"/><rect width="6" height="236" fill="#2563eb" rx="3"/>
    <text x="20" y="28" fill="#165170" font-size="14" font-weight="700">.env — Frontend</text>
    <g font-size="11.5" fill="#374151">
      <text x="20" y="52">NEXT_PUBLIC_USE_BACKEND = true | false  (modo)</text>
      <text x="20" y="72">BACKEND_URL / NEXT_PUBLIC_API_URL  (proxy / API)</text>
      <text x="20" y="92">INTERNAL_API_SECRET  (= al del backend)</text>
      <text x="20" y="112">AUTH_SECRET · AUTH_URL · AUTH_TRUST_HOST</text>
      <text x="20" y="132">AUTH_KEYCLOAK_ID / _SECRET / _ISSUER</text>
      <text x="20" y="152">NEXT_PUBLIC_KEYCLOAK_URL / _REALM / _ISSUER</text>
      <text x="20" y="172">SENDGRID_API_KEY / _FROM_EMAIL  (correo)</text>
    </g>
    <text x="20" y="200" fill="#6b7280" font-size="11">NEXT_PUBLIC_* = visibles al navegador (no secretos).</text>
    <text x="20" y="218" fill="#6b7280" font-size="11">AUTH_* / BACKEND_URL / SENDGRID_* = solo servidor.</text>
  </g>

  <!-- .env Backend -->
  <g transform="translate(615,320)">
    <rect width="545" height="236" rx="12" fill="#fff" stroke="#e5e7eb"/><rect width="6" height="236" fill="#16a34a" rx="3"/>
    <text x="20" y="28" fill="#165170" font-size="14" font-weight="700">.env — Backend</text>
    <g font-size="11.5" fill="#374151">
      <text x="20" y="52">DATABASE_URL  (postgresql+psycopg://…)</text>
      <text x="20" y="72">PARQUET_PATH · HEXAGON_INGEST=copy|orm · RUN_INGEST</text>
      <text x="20" y="92">KEYCLOAK_ISSUER / _JWKS_URL / _AUDIENCE · JWT_ALGORITHMS</text>
      <text x="20" y="112">INTERNAL_API_SECRET · CORS_ORIGINS</text>
      <text x="20" y="132">DB_POOL_SIZE 5 · DB_MAX_OVERFLOW 15 · _TIMEOUT · _RECYCLE</text>
      <text x="20" y="152">APP_THREAD_LIMIT 18 · EXCLUDED_CACHE_TTL 300</text>
      <text x="20" y="172">OFFSHORE_VAR · MAX_HISTORIAL_PER_USER 50 · INGEST_MEM_CAP_MB</text>
      <text x="20" y="192">DEBUG_INFLIGHT · TRACE_REQUESTS · INFLIGHT_WARN · SLOW_REQUEST_MS</text>
    </g>
    <text x="20" y="220" fill="#6b7280" font-size="11">dev: carga .env (dotenv) · prod: env del contenedor.</text>
  </g>

  <!-- Migraciones / tools -->
  <g transform="translate(40,572)">
    <rect width="720" height="180" rx="12" fill="#fff" stroke="#e5e7eb"/><rect width="6" height="180" fill="#165170" rx="3"/>
    <text x="20" y="28" fill="#165170" font-size="14" font-weight="700">Migraciones y herramientas</text>
    <text x="20" y="52" fill="#374151" font-size="12">alembic upgrade head  → aplica 0001…0015 (última: índice parcial excluidos)</text>
    <text x="20" y="74" fill="#374151" font-size="12">Índice sin lock largo (opcional): CREATE INDEX CONCURRENTLY … + alembic stamp 0015</text>
    <text x="20" y="100" fill="#1f2937" font-size="12" font-weight="700">Tools (python -m tools.…):</text>
    <text x="20" y="120" fill="#374151" font-size="12">ingest_parquet · ingest_bundle (--plan) · ingest_docs · inspect_parquet(s)</text>
    <text x="20" y="140" fill="#374151" font-size="12">loadtest.py --base … --cookie … [--db-url …]  (carga + EXPLAIN/salud BD)</text>
    <text x="20" y="166" fill="#6b7280" font-size="11">Reingesta controlada por consola (no hay endpoint que pise datos curados).</text>
  </g>

  <!-- Verificación + memoria -->
  <g transform="translate(780,572)">
    <rect width="380" height="180" rx="12" fill="#0f3547"/>
    <text x="20" y="28" fill="#fff" font-size="14" font-weight="700">Verificación + red de memoria</text>
    <text x="20" y="54" fill="#cfe3ee" font-size="12">curl /api/health</text>
    <text x="20" y="74" fill="#cfe3ee" font-size="12">loadtest --db-url → cache-hit &gt;99%,</text>
    <text x="20" y="92" fill="#9fc3d6" font-size="11.5">variables-bulk ok, warmup/excluded &lt;10 ms</text>
    <text x="20" y="118" fill="#cfe3ee" font-size="12">Server chico: swap 4 GB + earlyoom</text>
    <text x="20" y="138" fill="#9fc3d6" font-size="11.5">(fallocate/mkswap/swapon + apt install earlyoom)</text>
    <text x="20" y="164" fill="#9fc3d6" font-size="11.5">Son mitigaciones; el fix real es Fase 2 + RAM.</text>
  </g>

  <!-- Ramas -->
  <g transform="translate(40,764)">
    <rect width="1120" height="150" rx="12" fill="#fff" stroke="#e5e7eb"/>
    <text x="20" y="28" fill="#165170" font-size="14" font-weight="700">Ramas / despliegue</text>
    <text x="20" y="54" fill="#374151" font-size="12.5">Front (repo Vento): trabajo <tspan font-weight="700">Sprint_4--report_preconig / develop</tspan> → producción <tspan font-weight="700">deploy-prod</tspan></text>
    <text x="20" y="76" fill="#374151" font-size="12.5">Backend: trabajo <tspan font-weight="700">develop</tspan> → producción <tspan font-weight="700">main</tspan> (prod consume main, no develop)</text>
    <text x="20" y="102" fill="#1f2937" font-size="12.5" font-weight="700">Tras merge a prod:</text>
    <text x="150" y="102" fill="#374151" font-size="12.5">alembic upgrade head · VACUUM ANALYZE hexagon · build del front.</text>
    <text x="20" y="128" fill="#6b7280" font-size="11.5">Docker (prod): entrypoint aplica migraciones (y opcional RUN_INGEST) y arranca gunicorn -w 2 --timeout 120.</text>
  </g>

  <text x="40" y="952" fill="#6b7280" font-size="11">Vento · Mavalan Software · resumen visual del Manual de Instalación (docs/manual-instalacion.md)</text>
</svg>
