body: |
  ## Historia de Usuario
  Como analista, quiero que el informe PDF refleje los scores reales del modelo multicriterio (no placeholders) cuando esté listo, para entregar análisis productivos.

  **Épica:** E6 — Reportes / Informe PDF

  ## Criterios de Aceptación
  1. Reemplazar placeholders por consumo del endpoint `/api/score/{h3Index}` (o similar — definir con backend)
  2. Validar que los scores reales aparecen correctamente en el template
  3. Quitar feature flag (US06-AC4) y banda "Datos de muestra"
  4. Validación stakeholders del informe con datos reales
  5. Tests: endpoint retorna scores; PDF refleja valores correctos

  ## Estado
  ⏸ **BLOQUEADA** — espera versión avanzada del modelo multicriterio del equipo de investigación.

  ## Dependencias
  US06-AC1, modelo multicriterio en versión avanzada

  ## Estimación tras desbloqueo
  4-6h
