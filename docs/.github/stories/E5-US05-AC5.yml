body: |
  ## Historia de Usuario
  Como dev del flujo, necesito decidir y documentar de dónde viene el catálogo de modelos de aerogeneradores para implementar US05-AC1 y AC2.

  **Épica:** E5 — Características del Proyecto (decisión técnica)

  ## Criterios de Aceptación
  1. Catálogo de modelos accesible al frontend con estructura `{ id, fabricante, modelo, capacidad_MW, altura_min, altura_max, rotor_diametro, ... }`
  2. Decisión documentada en **ADR-014**:
     - Opción A: JSON estático en `public/data/turbines.json` (rápido, sin latencia, requiere redeploy para actualizar)
     - Opción B: endpoint backend `/api/turbines` (actualizable sin redeploy, +complejidad)
  3. 5+ modelos cargan correctamente y son seleccionables
  4. Test: lectura del catálogo retorna lista esperada

  ## Estado
  ⏸ **BLOQUEADA** — espera reunión con equipo de datos para definir estructura y mantenedor.

  ## Dependencias
  (Reunión equipo de datos)

  ## Estimación tras desbloqueo
  2h (JSON) o 4h (BE)
