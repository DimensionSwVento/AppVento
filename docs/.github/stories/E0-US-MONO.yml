body: |
  ## Historia de Usuario
  Como desarrollador del equipo, necesito el proyecto Next.js inicializado con la estructura base para que todos los módulos (páginas, API routes, componentes) convivan en un solo proyecto.

  **Épica:** E0 — Fundación e Infraestructura

  ## Criterios de Aceptación
  1. Proyecto Next.js 16+ (App Router) con TypeScript y Tailwind CSS
  2. Estructura: `src/app/` (páginas), `src/app/api/` (API routes backend), `src/types/` (tipos compartidos)
  3. React Compiler habilitado en next.config.ts
  4. Scripts funcionales: `dev`, `build`, `start`, `lint` desde package.json
  5. deck.gl + react-map-gl + maplibre-gl + h3-js como dependencias del mapa
  6. ESLint configurado con eslint-config-next
  7. Rutas base creadas: login, dashboard, area-selection, dimensions
  8. API routes base: /api/health, /api/hexagons, /api/users

  ## Desbloquea
  Todas las demás historias
