name: CI Pipeline

# ═══════════════════════════════════════════════════════════════════════════
# Vento — Automated Testing Pipeline
# Implementación del protocolo descrito en paper.md (Sec. III, Fig. 1):
#
#   Commit → Build → Test → AI Analysis → Deploy
#
# Sec. IV, Fig. 2 del paper define dos jobs principales para Vento:
#   (i)  frontend-quality-ai : ejecuta build + quality gates + AI Analyzer
#   (ii) deployment-gate     : usa la salida del AI Analyzer para
#                              permitir o bloquear el deploy
#
# Jobs auxiliares (security, deploy) se mantienen como buenas prácticas
# y se gobiernan por el resultado del deployment-gate.
# ═══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
      - "feature/**"
    paths-ignore:
      - "**.md"
      - ".github/stories/**"
      - "_bmad/**"
      - "_bmad-output/**"
      - "docs/**"
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    working-directory: Vento

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # JOB (i): frontend-quality-ai
  # Implementa Build + Test + AI Analysis del protocolo (paper Fig. 1).
  # Produce todos los artefactos en quality-evidence/{logs,reports,ai}/
  # ═══════════════════════════════════════════════════════════════════════
  frontend-quality-ai:
    name: "frontend-quality-ai (Build + Test + AI Analysis)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Vento/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ── Build phase ────────────────────────────────────────────────────
      - name: Build phase — compile Next.js
        run: |
          mkdir -p quality-evidence/logs
          npm run build 2>&1 | tee quality-evidence/logs/build.log
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_KEYCLOAK_SECRET: ${{ secrets.AUTH_KEYCLOAK_SECRET }}
          AUTH_KEYCLOAK_ISSUER: ${{ secrets.AUTH_KEYCLOAK_ISSUER }}
          NEXT_PUBLIC_KEYCLOAK_URL: ${{ secrets.NEXT_PUBLIC_KEYCLOAK_URL }}
          NEXT_PUBLIC_KEYCLOAK_REALM: ${{ secrets.NEXT_PUBLIC_KEYCLOAK_REALM }}
          NEXT_PUBLIC_KEYCLOAK_ISSUER: ${{ secrets.NEXT_PUBLIC_KEYCLOAK_ISSUER }}

      # ── Test phase: quality gates aggregated by attribute ──────────────
      - name: Test phase — lint
        run: npm run lint 2>&1 | tee quality-evidence/logs/lint.log

      - name: Test phase — typecheck
        run: npx tsc --noEmit 2>&1 | tee quality-evidence/logs/typecheck.log

      - name: Test phase — unit tests + attribute coverage collect
        run: npm run qa:collect 2>&1 | tee quality-evidence/logs/test.log

      # ── AI Analysis phase ──────────────────────────────────────────────
      - name: AI Analysis phase — call AI Pipeline Analyzer (OpenRouter)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_PIPELINE_MODEL: ${{ vars.AI_PIPELINE_MODEL || 'openai/gpt-4o-mini' }}
          AI_PIPELINE_REFERER: https://github.com/${{ github.repository }}
          AI_PIPELINE_TITLE: Vento AI Pipeline Analyzer
          GIT_SHA: ${{ github.sha }}
        run: npm run qa:ai 2>&1 | tee quality-evidence/logs/ai-analysis.log

      - name: Publish quality evidence (logs/, reports/, ai/)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence-${{ github.sha }}
          path: Vento/quality-evidence/
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════════════
  # JOB (ii): deployment-gate
  # Conditional Deploy phase — consume el output del AI Pipeline Analyzer
  # y decide si la build se promueve (paper Sec. III/IV).
  # ═══════════════════════════════════════════════════════════════════════
  deployment-gate:
    name: "deployment-gate (AI-driven decision)"
    runs-on: ubuntu-latest
    needs: frontend-quality-ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download quality evidence
        uses: actions/download-artifact@v4
        with:
          name: quality-evidence-${{ github.sha }}
          path: Vento/quality-evidence/

      - name: Run deployment gate
        env:
          DEPLOY_GATE_STRICT: ${{ vars.DEPLOY_GATE_STRICT || 'false' }}
          GIT_SHA: ${{ github.sha }}
        run: npm run qa:gate

      - name: Publish deployment decision artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-decision-${{ github.sha }}
          path: Vento/quality-evidence/decision/
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════════════
  # Job auxiliar: seguridad de la cadena de suministro
  # Corre en paralelo. No es del protocolo del paper, pero refuerza el
  # atributo Security.
  # ═══════════════════════════════════════════════════════════════════════
  security:
    name: "Audit + Secrets Scan (Security attribute)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Vento/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Install gitleaks
        run: |
          wget -qO- https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_8.24.3_linux_x64.tar.gz | tar xz -C /usr/local/bin gitleaks
        working-directory: /tmp

      - name: Scan for secrets (gitleaks)
        run: gitleaks detect --source . --verbose

  # ═══════════════════════════════════════════════════════════════════════
  # Deploy — sólo si deployment-gate y security pasan
  # ═══════════════════════════════════════════════════════════════════════
  deploy:
    name: "Deploy Branch (gated)"
    runs-on: ubuntu-latest
    needs: [deployment-gate, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target branch
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "branch=deploy-test" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "branch=deploy-prod" >> $GITHUB_OUTPUT
          fi
        working-directory: .

      - name: Build and push deploy branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DEPLOY_BRANCH="${{ steps.target.outputs.branch }}"
          SOURCE_SHA="${{ github.sha }}"

          git checkout --orphan "${DEPLOY_BRANCH}-tmp"
          git rm -rf .

          git checkout "${SOURCE_SHA}" -- Vento/

          shopt -s dotglob
          mv Vento/* .
          rm -rf Vento

          rm -rf docs _bmad _bmad-output infra node_modules .next

          git add -A
          git commit -m "deploy: ${DEPLOY_BRANCH} from ${SOURCE_SHA::7}"

          git push origin HEAD:refs/heads/${DEPLOY_BRANCH} --force
        working-directory: .
